name: publish
on:
  push:
    tags: ['v*-beta.*']
  release:
    types: [published]
  workflow_run:
    workflows: [checks]
    branches: [main]
    types: [completed]
  workflow_dispatch:
    inputs:
      channel:
        description: npm release channel
        type: choice
        options: [stable, beta]
        required: true
      version:
        description: Exact version (beta requires X.Y.Z-beta.N)
        required: true
        type: string
      source_ref:
        description: Verified main commit or stable release tag
        default: main
        required: true
        type: string
permissions:
  contents: read
jobs:
  beta:
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'release' && contains(github.event.release.tag_name, '-beta'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Dispatch the Beta tag to the main publisher
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/dispatch-beta-release.ts
      - uses: pnpm/action-setup@v4
        if: github.event_name == 'release'
      - if: github.event_name == 'release'
        run: pnpm install --frozen-lockfile
      - name: Add tagged compatibility declarations to Beta Release notes
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: node --import tsx scripts/release-compatibility.ts
  npm:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-latest
    timeout-minutes: 35
    concurrency:
      # Preserve the Dev group so publishers already running during rollout stay serialized.
      group: ${{ inputs.channel == 'beta' && 'covro-npm-publish-beta' || inputs.channel == 'stable' && 'covro-npm-publish-stable' || 'covro-npm-publish' }}
      cancel-in-progress: false
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || inputs.source_ref }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require successful checks and main ancestry
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_CHANNEL: ${{ inputs.channel || 'dev' }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          node --input-type=module <<'JS'
          import { execFileSync } from 'node:child_process';
          import { existsSync } from 'node:fs';
          const sha = execFileSync('git', ['rev-parse','HEAD'], {encoding:'utf8'}).trim();
          execFileSync('git', ['merge-base', '--is-ancestor', sha, 'refs/remotes/origin/main']);
          if (process.env.RELEASE_CHANNEL === 'beta') {
            const version = process.env.RELEASE_VERSION || '';
            if (!/^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)-beta\.(0|[1-9]\d*)$/.test(version))
              throw new Error('Beta version must use X.Y.Z-beta.N');
            const tagged = execFileSync('git', ['rev-parse', `refs/tags/v${version}^{commit}`], {encoding:'utf8'}).trim();
            if (tagged !== sha) throw new Error('Beta source must match its exact version tag');
          }
          if (!existsSync('scripts/verify-published-release.ts'))
            throw new Error('Source predates publication verification; select a newer main commit');
          const pages = JSON.parse(execFileSync('gh', ['api', `repos/${process.env.GITHUB_REPOSITORY}/commits/${sha}/check-runs`, '--paginate', '--slurp'], {encoding:'utf8'}));
          if (!pages.flatMap(page => page.check_runs).some(run => run.name === 'verify' && run.conclusion === 'success' && run.app?.slug === 'github-actions')) {
            throw new Error('This exact commit has not passed checks/verify. Wait for CI and retry.');
          }
          JS
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - name: Resolve and stamp the immutable npm version
        id: prepare
        env:
          RELEASE_CHANNEL: ${{ inputs.channel || 'dev' }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: node --import tsx scripts/prepare-release.ts
      - if: steps.prepare.outputs.skip != 'true'
        run: pnpm build
      - if: steps.prepare.outputs.skip != 'true'
        run: node --import tsx scripts/verify-production.ts
      - if: steps.prepare.outputs.skip != 'true'
        run: node --import tsx scripts/verify-package.ts
      - if: steps.prepare.outputs.skip != 'true'
        run: node --import tsx scripts/verify-upgrade.ts
      - name: Publish through npm trusted publishing
        if: steps.prepare.outputs.skip != 'true'
        env:
          RELEASE_TAG: ${{ steps.prepare.outputs.tag }}
        run: npm publish --access public --provenance --tag "$RELEASE_TAG"
      - name: Wait for the published version and channel to become visible
        if: steps.prepare.outputs.skip != 'true'
        run: node --import tsx scripts/verify-published-release.ts
      - name: Create the Dev GitHub prerelease
        if: steps.prepare.outputs.dev_release_version != ''
        env:
          GH_TOKEN: ${{ github.token }}
          DEV_RELEASE_VERSION: ${{ steps.prepare.outputs.dev_release_version }}
          DEV_BASE_VERSION: ${{ steps.prepare.outputs.dev_base_version }}
          DEV_BASE_COMMIT: ${{ steps.prepare.outputs.dev_base_commit }}
        run: node --import tsx scripts/dev-github-release.ts
  beta_release:
    needs: npm
    if: >-
      github.ref == 'refs/heads/main' &&
      github.event_name == 'workflow_dispatch' && inputs.channel == 'beta'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: covro-beta-github-${{ inputs.version }}
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      # Run the release automation from this main workflow, even when promoting older source.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: pnpm install --frozen-lockfile
      - name: Create the Beta GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          BETA_RELEASE_VERSION: ${{ inputs.version }}
          BETA_SOURCE_REF: ${{ inputs.source_ref }}
        run: node --import tsx scripts/beta-github-release.ts

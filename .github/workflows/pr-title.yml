name: PR title
on:
  pull_request:
    types: [opened, reopened, edited, synchronize, ready_for_review]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to validate (including generated Release PRs)
        required: true
        type: string
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: pr-title-${{ github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: true
jobs:
  validate:
    name: PR title
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # This read-only pull_request workflow also handles forks. No target context,
      # write token, repository secrets, install scripts, or title shell expansion.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Validate the current PR title
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/check-pr-title.ts
